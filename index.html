<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>观妙 · 道德经冥想</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="观妙">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="apple-touch-icon-512.png">
<link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon-180.png">
<meta name="theme-color" content="#1a1612">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;padding:0;background:#1a1612;color:#d4c4a8;
            font-family:-apple-system,"PingFang SC",sans-serif;line-height:1.7;min-height:100vh;overflow-x:hidden}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

  .view{display:none;min-height:100vh;flex-direction:column}
  .view.active{display:flex}

  /* 启动 */
  #splash{align-items:center;justify-content:center;text-align:center}
  #splash h1{font-size:80px;font-weight:200;letter-spacing:24px;margin:0;
             padding-left:24px;color:#d4c4a8;font-family:"Songti SC",serif;
             opacity:0;animation:textIn 1.2s 0.2s ease-out forwards}
  @keyframes textIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  /* 主页 */
  #home{padding:60px 24px 100px;align-items:center}
  .today-tag{color:#8a7e6e;font-size:13px;letter-spacing:6px;margin:32px 0}
  .ch-card{width:100%;max-width:520px;text-align:center}
  .ch-num{color:#8a7e6e;font-size:13px;letter-spacing:8px;margin-bottom:12px}
  .ch-title{font-size:42px;font-weight:300;letter-spacing:14px;margin:0 0 40px;
            color:#e8d8b8;padding-left:14px;font-family:"Songti SC",serif}
  .ch-text{color:#a89e8e;font-size:16px;line-height:2.2;margin:0 0 56px;
           font-family:"Songti SC",serif;letter-spacing:2px;white-space:pre-line}
  .play-btn{width:96px;height:96px;border-radius:50%;background:transparent;
            border:1px solid #6a5e4e;color:#d4c4a8;font-size:32px;
            display:flex;align-items:center;justify-content:center;
            margin:0 auto 16px;cursor:pointer;transition:all 0.3s}
  .play-btn:active{background:#2a2520;transform:scale(0.96)}
  .play-btn .triangle{margin-left:6px}
  .duration{color:#6a5e4e;font-size:12px;letter-spacing:4px;margin-top:12px}
  .more-link{position:fixed;bottom:48px;right:32px;color:#5a4e3e;background:transparent;
             border:none;font-size:24px;cursor:pointer;letter-spacing:4px;padding:12px}

  /* 播放中 */
  #playing{padding:80px 24px;align-items:center;justify-content:flex-start}
  #playing .ch-num{font-size:13px;letter-spacing:8px;color:#6a5e4e;margin-bottom:16px}
  #playing .ch-title{font-size:36px;letter-spacing:12px;color:#a89e8e;
                     padding-left:12px;margin:0 0 80px;font-family:"Songti SC",serif;font-weight:300}
  .playing-text{color:#5a4e3e;font-size:14px;line-height:2.4;text-align:center;
                font-family:"Songti SC",serif;letter-spacing:2px;opacity:0.4;
                max-width:480px;white-space:pre-line}
  .playing-controls{position:fixed;bottom:80px;left:0;right:0;display:flex;
                    justify-content:center;gap:48px}
  .ctrl-btn{width:64px;height:64px;border-radius:50%;background:transparent;
            border:1px solid #6a5e4e;color:#d4c4a8;font-size:22px;
            display:flex;align-items:center;justify-content:center;cursor:pointer}
  .ctrl-btn:active{background:#2a2520}
  .breathing{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);
             width:8px;height:8px;border-radius:50%;background:#6a5e4e;
             animation:breathe 6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:0.3;transform:translateX(-50%) scale(1)}
                     50%{opacity:0.8;transform:translateX(-50%) scale(2.5)}}

  /* 完成 */
  #done{padding:120px 32px;align-items:center;text-align:center}
  .done-tag{color:#8a7e6e;font-size:14px;letter-spacing:8px;margin-bottom:48px}
  .quote{color:#d4c4a8;font-size:24px;font-weight:300;line-height:2;
         font-family:"Songti SC",serif;letter-spacing:6px;max-width:480px;margin:0 0 16px;white-space:pre-line}
  .quote-from{color:#6a5e4e;font-size:13px;letter-spacing:4px;margin-bottom:80px}
  .close-btn{background:transparent;border:1px solid #6a5e4e;color:#8a7e6e;
             padding:14px 48px;border-radius:32px;font-size:14px;letter-spacing:4px;
             cursor:pointer;font-family:inherit}
  .close-btn:active{background:#2a2520}

  /* 章节列表 */
  #list{padding:60px 0 80px}
  .list-header{padding:0 24px 32px;display:flex;align-items:center;justify-content:space-between}
  .list-title{font-size:20px;font-weight:300;letter-spacing:8px;color:#d4c4a8;
              padding-left:8px;margin:0;font-family:"Songti SC",serif}
  .back-btn{background:transparent;border:none;color:#8a7e6e;font-size:14px;
            padding:8px 12px;cursor:pointer;letter-spacing:2px}
  .ch-item{display:flex;align-items:baseline;padding:18px 24px;
           border-bottom:1px solid #2a2520;cursor:pointer}
  .ch-item:active{background:#221d18}
  .ch-item.current{background:#221d18}
  .ch-item.disabled{opacity:0.35;cursor:default}
  .ch-item.disabled:active{background:transparent}
  .ch-item .num{color:#5a4e3e;font-size:13px;letter-spacing:2px;width:64px;flex-shrink:0;
                font-family:"SF Mono",monospace}
  .ch-item .name{color:#a89e8e;font-size:16px;letter-spacing:3px;font-family:"Songti SC",serif;flex:1}
  .ch-item.current .name{color:#e8d8b8}
  .ch-item.current .num{color:#8a7e6e}
  .ch-item .listened{color:#5a4e3e;font-size:11px;letter-spacing:1px;margin-left:12px}

  audio{display:none}
</style>
</head>
<body>

<!-- 启动 -->
<div class="view" id="splash"><h1>观  妙</h1></div>

<!-- 主页 -->
<div class="view" id="home">
  <div style="height:60px"></div>
  <div class="today-tag">今 日</div>
  <div class="ch-card">
    <div class="ch-num" id="home-num">第 一 章</div>
    <div class="ch-title" id="home-title">道  可  道</div>
    <div class="ch-text" id="home-text"></div>
    <button class="play-btn" onclick="goPlay()"><span class="triangle">▶</span></button>
    <div class="duration">十 五 分 钟</div>
  </div>
  <button class="more-link" onclick="show('list')">···</button>
</div>

<!-- 播放中 -->
<div class="view" id="playing">
  <div style="height:40px"></div>
  <div class="ch-num" id="play-num">第 一 章</div>
  <div class="ch-title" id="play-title">道  可  道</div>
  <div class="playing-text" id="play-text"></div>
  <div class="breathing"></div>
  <div class="playing-controls">
    <button class="ctrl-btn" onclick="togglePlay()" id="play-toggle">⏸</button>
    <button class="ctrl-btn" onclick="show('home');stopAudio()">×</button>
  </div>
</div>

<!-- 完成 -->
<div class="view" id="done">
  <div class="done-tag">今 日 完 成</div>
  <div class="quote" id="done-quote"></div>
  <div class="quote-from" id="done-from"></div>
  <button class="close-btn" onclick="show('home');stopAudio()">关 闭</button>
</div>

<!-- 章节列表 -->
<div class="view" id="list">
  <div class="list-header">
    <h2 class="list-title">八 十 一 章</h2>
    <button class="back-btn" onclick="show('home')">‹ 返回</button>
  </div>
  <div id="chapters"></div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
// === 数据:81 章 ===
const chapters = [
  {n:1,name:'道可道',text:'道可道,非常道。\n名可名,非常名。\n无名天地之始,\n有名万物之母。\n故常无,欲以观其妙;\n常有,欲以观其徼。',quote:'玄之又玄,众妙之门'},
  {n:2,name:'天下皆知美之为美',text:'天下皆知美之为美,斯恶已。\n皆知善之为善,斯不善已。\n故有无相生,难易相成。\n是以圣人处无为之事,行不言之教。\n功成而弗居,夫唯弗居,是以不去。',quote:'功成而弗居,是以不去'},
  {n:3,name:'不尚贤',text:'不尚贤,使民不争;\n不贵难得之货,使民不为盗;\n不见可欲,使民心不乱。\n是以圣人之治,虚其心,实其腹。\n为无为,则无不治。',quote:'为无为,则无不治'},
  {n:4,name:'道冲',text:'道冲,而用之或不盈。\n渊兮,似万物之宗。\n挫其锐,解其纷,\n和其光,同其尘。\n湛兮,似或存。',quote:'和其光,同其尘'},
  {n:5,name:'天地不仁',text:'天地不仁,以万物为刍狗。\n圣人不仁,以百姓为刍狗。\n天地之间,其犹橐籥乎?\n虚而不屈,动而愈出。\n多言数穷,不如守中。',quote:'多言数穷,不如守中'},
  {n:6,name:'谷神不死',text:'谷神不死,是谓玄牝。\n玄牝之门,是谓天地根。\n绵绵若存,用之不勤。',quote:'绵绵若存,用之不勤'},
  {n:7,name:'天长地久',text:'天长地久。\n天地所以能长且久者,\n以其不自生,故能长生。\n是以圣人后其身而身先,\n外其身而身存。',quote:'后其身而身先,外其身而身存'},
  {n:8,name:'上善若水',text:'上善若水。\n水善利万物而不争,\n处众人之所恶,故几于道。\n夫唯不争,故无尤。',quote:'夫唯不争,故无尤'},
  {n:9,name:'持而盈之',text:'持而盈之,不如其已;\n揣而锐之,不可长保。\n金玉满堂,莫之能守;\n富贵而骄,自遗其咎。\n功遂身退,天之道。',quote:'功遂身退,天之道'},
  {n:10,name:'载营魄抱一',text:'载营魄抱一,能无离乎?\n专气致柔,能如婴儿乎?\n涤除玄览,能无疵乎?\n生而不有,为而不恃,\n长而不宰,是谓玄德。',quote:'生而不有,为而不恃'},
  {n:11,name:'三十辐共一毂',text:'三十辐,共一毂,\n当其无,有车之用。\n埏埴以为器,当其无,有器之用。\n凿户牖以为室,当其无,有室之用。\n故有之以为利,无之以为用。',quote:'有之以为利,无之以为用'},
  {n:12,name:'五色令人目盲',text:'五色令人目盲;\n五音令人耳聋;\n五味令人口爽;\n驰骋畋猎,令人心发狂;\n是以圣人为腹不为目。',quote:'为腹不为目'},
  {n:13,name:'宠辱若惊',text:'宠辱若惊,贵大患若身。\n宠为下,得之若惊,失之若惊。\n吾所以有大患者,为吾有身。\n及吾无身,吾有何患?',quote:'及吾无身,吾有何患'},
  {n:14,name:'视之不见',text:'视之不见,名曰夷;\n听之不闻,名曰希;\n搏之不得,名曰微。\n是谓无状之状,无物之象。\n迎之不见其首,随之不见其后。',quote:'无状之状,无物之象'},
  {n:15,name:'古之善为道者',text:'古之善为道者,\n微妙玄通,深不可识。\n豫兮若冬涉川;\n敦兮其若朴;旷兮其若谷。\n孰能浊以静之徐清?\n孰能安以动之徐生?',quote:'孰能浊以静之徐清'},
  // 16-81: 暂未生成,显示但不可点
];
const TOTAL_AVAILABLE = 15;
const TOTAL_CHAPTERS = 81;
// 16-81 仅占位章名
const placeholderNames = ['致虚极','太上','大道废','绝圣弃智','绝学无忧','孔德之容','曲则全','希言自然','企者不立','有物混成','重为轻根','善行无辙迹','知其雄','将欲取天下','以道佐人主','夫兵者','道常无名','知人者智','大道泛兮','执大象','将欲歙之','道常无为','上德不德','昔之得一者','反者道之动','上士闻道','道生一','天下之至柔','名与身孰亲','大成若缺','天下有道','不出户','为学日益','圣人无常心','出生入死','道生之','天下有始','使我介然有知','善建者不拔','含德之厚','知者不言','以正治国','其政闷闷','治人事天','治大国','大国者下流','道者万物之奥','为无为','其安易持','古之善为道','江海所以为百谷王','天下皆谓我道大','善为士者不武','用兵有言','吾言甚易知','知不知','民不畏威','勇于敢则杀','民不畏死','民之饥','人之生也柔弱','天之道','天下莫柔弱于水','和大怨','小国寡民','信言不美'];

// === 状态 ===
const STORAGE_KEY = 'guanmiao-state-v1';
function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
  catch(e) { return {}; }
}
function saveState(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
let state = loadState();

// 选今日章
function chooseToday() {
  const now = Date.now();
  const lastOpen = state.lastOpenTs || 0;
  const hoursAgo = (now - lastOpen) / 3600000;
  // 同日打开:保持 todayCh
  if (state.todayCh && hoursAgo < 18) return state.todayCh;
  // 否则:推进到下一章(顺序循环)
  const prev = state.todayCh || 0;
  const next = (prev % TOTAL_AVAILABLE) + 1;  // 循环在已生成范围
  state.todayCh = next;
  state.lastOpenTs = now;
  saveState(state);
  return next;
}

// 渲染主页
let currentCh = chooseToday();
function renderHome(n) {
  currentCh = n;
  const ch = chapters.find(c => c.n === n);
  if (!ch) return;
  document.getElementById('home-num').textContent = `第 ${cnNum(n)} 章`;
  document.getElementById('home-title').textContent = spaceOut(ch.name);
  document.getElementById('home-text').textContent = ch.text;
  document.getElementById('play-num').textContent = `第 ${cnNum(n)} 章`;
  document.getElementById('play-title').textContent = spaceOut(ch.name);
  document.getElementById('play-text').textContent = ch.text.split('\n').slice(0,3).join('\n');
  document.getElementById('done-quote').textContent = ch.quote;
  document.getElementById('done-from').textContent = `— 第 ${cnNum(n)} 章`;
  document.getElementById('audio').src = `episode-${String(n).padStart(2,'0')}.mp3`;
}
function cnNum(n) {
  const map = ['','一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
  return map[n] || String(n);
}
function spaceOut(s) {
  return s.split('').join(' ');
}

// 章节列表
function renderList() {
  const html = [];
  for (let i = 1; i <= TOTAL_CHAPTERS; i++) {
    const available = i <= TOTAL_AVAILABLE;
    const ch = available ? chapters.find(c => c.n === i) : { name: placeholderNames[i-16] || '' };
    const cls = ['ch-item'];
    if (i === currentCh) cls.push('current');
    if (!available) cls.push('disabled');
    const onclick = available ? `pickChapter(${i})` : '';
    const listened = state.listened && state.listened[i] ? '<span class="listened">已听</span>' : '';
    html.push(`<div class="${cls.join(' ')}" ${available ? `onclick="${onclick}"` : ''}>
      <span class="num">${String(i).padStart(2,'0')}</span>
      <span class="name">${ch.name}</span>
      ${listened}
    </div>`);
  }
  document.getElementById('chapters').innerHTML = html.join('');
}

function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'list') renderList();
  window.scrollTo(0, 0);
}

function goPlay() {
  show('playing');
  const a = document.getElementById('audio');
  // 中断恢复:6h 内回到 currentTime
  const now = Date.now();
  const lastPause = state.lastPauseTs || 0;
  if (state.lastCh === currentCh && state.lastPauseAt && (now - lastPause) < 6 * 3600000) {
    a.currentTime = state.lastPauseAt;
  }
  a.play().catch(() => {});
  document.getElementById('play-toggle').textContent = '⏸';
  if ('mediaSession' in navigator) {
    const ch = chapters.find(c => c.n === currentCh);
    navigator.mediaSession.metadata = new MediaMetadata({
      title: `第${cnNum(currentCh)}章 · ${ch.name}`,
      artist: '观妙', album: '道德经冥想',
      artwork: [{ src: 'cover.png', sizes: '1400x1400' }]
    });
  }
}
function stopAudio() {
  const a = document.getElementById('audio');
  // 记录暂停时间(用于中断恢复)
  if (a.currentTime > 5 && a.currentTime < a.duration - 5) {
    state.lastCh = currentCh;
    state.lastPauseAt = a.currentTime;
    state.lastPauseTs = Date.now();
    saveState(state);
  }
  a.pause();
}
function togglePlay() {
  const a = document.getElementById('audio');
  if (a.paused) { a.play(); document.getElementById('play-toggle').textContent = '⏸'; }
  else { a.pause(); document.getElementById('play-toggle').textContent = '▶'; }
}
function pickChapter(n) {
  state.todayCh = n;
  state.lastOpenTs = Date.now();
  saveState(state);
  renderHome(n);
  show('home');
}

// 听完
document.getElementById('audio').addEventListener('ended', () => {
  // 标记已听
  state.listened = state.listened || {};
  state.listened[currentCh] = (state.listened[currentCh] || 0) + 1;
  // 清除中断点
  delete state.lastCh; delete state.lastPauseAt; delete state.lastPauseTs;
  saveState(state);
  show('done');
});

// 启动序列:启动画面 → 主页(1.5s)
renderHome(currentCh);
show('splash');
setTimeout(() => show('home'), 1600);
</script>
</body>
</html>
